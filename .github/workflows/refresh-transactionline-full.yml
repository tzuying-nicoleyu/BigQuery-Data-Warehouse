name: Refresh — transactionline (full, monthly)

on:
  schedule:
    - cron: "0 2 1 * *"   # 1st of every month at 02:00 UTC
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # Pass 2 adds ~30 min; generous buffer

    env:
      REALM:           ${{ secrets.REALM }}
      CONSUMER_KEY:    ${{ secrets.CONSUMER_KEY }}
      CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
      TOKEN_ID:        ${{ secrets.TOKEN_ID }}
      TOKEN_SECRET:    ${{ secrets.TOKEN_SECRET }}
      ACCOUNT_HOST:    ${{ secrets.ACCOUNT_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > /tmp/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> "$GITHUB_ENV"

      - name: Run full transactionline refresh (Pass 1 + Pass 2 + merge)
        run: python refresh.py --job transactionline_full
